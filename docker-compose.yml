version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: kabadiwala_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: urban_mining
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data

volumes:
  postgis_data: